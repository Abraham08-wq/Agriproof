<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F7A2E">
<title>AgriProof field office</title>
<link rel="icon" href="/app/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style nonce="{{NONCE}}">
{{THEME}}
body{min-height:100vh}
/* sign in */
.split{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.split .photo{position:relative;background:url("/brand/hero.jpg") center/cover no-repeat,linear-gradient(160deg,#8DDC7F,#2E9A3A 70%);overflow:hidden}
.split .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(200deg,rgba(255,255,255,0) 40%,rgba(22,96,42,.55))}
.split .photo .words{position:absolute;left:44px;bottom:44px;right:44px;z-index:1;color:#fff}
.split .photo h1{color:#fff;font-size:clamp(34px,4vw,54px);font-weight:800;max-width:14ch}
.split .photo p{color:#EAF9E2;font-size:19px;max-width:40ch;margin:10px 0 0}
.split .photo .credit{color:#DDF2D3;position:absolute;right:16px;top:12px;z-index:1}
.split .photo .credit a{color:inherit}
.split .form{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(24px,6vw,90px);position:relative}
.split .form .maize{width:74px;height:136px;margin-bottom:8px}
.split .form h2{font-size:34px}
.split .form form{max-width:400px;margin-top:22px}
@media (max-width:860px){.split{grid-template-columns:1fr}.split .photo{min-height:260px}.split .photo .words{left:20px;bottom:20px}}

/* shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.rail{background:var(--shoot);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.rail .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:21px;padding:4px 10px 18px}
.rail .brand svg{width:30px;height:30px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:0;background:transparent;font-weight:700;cursor:pointer;text-align:left;color:var(--soil-2);position:relative}
.nav svg{width:22px;height:22px;color:var(--stalk)}
.nav:hover{background:var(--shoot-2)}
.nav[aria-current="page"]{background:var(--paper);color:var(--soil);box-shadow:0 6px 16px -12px rgba(31,122,46,.6)}
.nav .dot{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--tassel);color:#3B2A00;font-size:12px;display:grid;place-items:center;padding:0 6px}
.rail .foot{margin-top:auto;padding:10px;font-size:14px;color:var(--soil-2)}
.rail .foot button{margin-top:8px}
main{padding:26px clamp(18px,3vw,40px) 60px;min-width:0}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:2px;border-right:0;border-bottom:1px solid var(--line)}
  .rail .brand,.rail .foot{display:none}
  .nav{white-space:nowrap;padding:10px}
}
.mode{padding:12px 16px;border-radius:var(--r-s);margin:0 0 18px;background:var(--tassel-soft);color:var(--tassel-ink)}
.mode.live{background:var(--shoot);color:var(--stalk-dark)}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0 0 18px}
.head h1{font-size:32px;font-weight:800}
.head p{margin:4px 0 0;color:var(--soil-2)}
.head .grow{flex:1;min-width:240px}

/* overview banner */
.banner{position:relative;border-radius:var(--r-l);overflow:hidden;min-height:210px;color:#fff;margin-bottom:20px;
  background:url("/brand/field.jpg") center 55%/cover no-repeat,linear-gradient(140deg,#7AD36C,#2E9A3A 65%)}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(22,96,42,.78),rgba(22,96,42,.15) 70%)}
.banner .in{position:relative;z-index:1;padding:30px;max-width:560px}
.banner h1{color:#fff;font-size:36px;font-weight:800}
.banner p{color:#EAF9E2;margin:8px 0 0;font-size:18px}
.banner .maize{position:absolute;z-index:1;right:28px;bottom:6px;width:86px;height:158px}
.banner .maize .stalk{stroke:#fff}
.banner .maize .ground{stroke:rgba(255,255,255,.6)}
.banner .credit{position:absolute;z-index:1;right:12px;top:8px;color:#E2F5D9}
.banner .credit a{color:inherit}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;display:flex;gap:14px;align-items:center}
.stat .si{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--shoot);color:var(--stalk);flex:none}
.stat .si svg{width:26px;height:26px}
.stat.gold .si{background:var(--tassel-soft);color:var(--tassel-ink)}
.stat.red .si{background:var(--tomato-soft);color:#A3301A}
.stat b{display:block;font-family:var(--display);font-size:25px;white-space:nowrap;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat span{color:var(--soil-2);font-size:14px}
.health{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.hp{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-s);background:var(--paper);border:1px solid var(--line)}
.hp i{width:12px;height:12px;border-radius:50%;background:var(--leaf);margin-top:6px;flex:none;box-shadow:0 0 0 4px var(--shoot)}
.hp.bad i{background:var(--tomato);box-shadow:0 0 0 4px var(--tomato-soft)}
.hp small{display:block;color:var(--soil-2)}

/* panels, tables */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;margin-bottom:18px;min-width:0}
.panel h2{font-size:22px;display:flex;align-items:center;gap:10px}
.panel h2 svg{width:24px;height:24px;color:var(--leaf)}
.panel .sub{color:var(--soil-2);margin:4px 0 14px}
.side{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.side{grid-template-columns:1fr}}
.chip{white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;align-items:start}
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--soil-2);font-weight:700;padding:8px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--morning)}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px;word-break:break-all}
.reasons{margin:4px 0 0;padding-left:18px;color:var(--soil-2);font-size:14px}
.empty{padding:26px;text-align:center;color:var(--soil-2);border:1px dashed var(--line);border-radius:var(--r-s);background:var(--morning)}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
.forms .wide{grid-column:1 / -1}
.inline{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:8px;padding:12px;border-radius:var(--r-s);background:var(--morning)}
.inline .field{margin:0;flex:1;min-width:150px}
.input{min-height:46px;font-size:16px}
.btn{min-height:46px;font-size:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.tabs button{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;color:var(--soil-2)}
.tabs button[aria-pressed="true"]{border-color:var(--stalk);background:var(--shoot);color:var(--stalk-dark)}
.back{border:0;background:none;color:var(--stalk);font-weight:700;cursor:pointer;padding:0;margin-bottom:8px;display:inline-flex;align-items:center;gap:6px}
.back svg{width:18px;height:18px}
.toast{position:fixed;right:20px;bottom:20px;max-width:420px;padding:14px 18px;border-radius:var(--r-m);background:var(--soil);color:#fff;font-weight:700;z-index:30;transition:opacity .25s,transform .25s}
.toast.off{opacity:0;transform:translateY(12px);pointer-events:none}
.toast.bad{background:#A3301A}
.verdict{padding:14px 16px;border-radius:var(--r-s);background:var(--shoot);margin-top:10px}
.verdict.medium{background:var(--tassel-soft)} .verdict.high{background:var(--tomato-soft)}
.full{width:100%}
.center{display:grid;place-items:center;min-height:50vh}
.center .maize{width:80px;height:146px}
</style>
</head>

    const view = await ({ overview, coops, flags, inputs, money, audit })[st.sec]();
    const m = st.sys.payments_mode;

  if (st.sub) return payrunDetail(st.sub);
  const [rec, fundings, runs, payouts] = await Promise.all([req("/reconciliation"), req("/fundings"), req("/payruns"), req("/payouts")]);
  const L = rec.latest;
  const problem = payouts.filter(p => ["unknown", "manual", "failed"].includes(p.status));
  const testMode = rec.mode === "test";
  return el("div", {}, head("Money", `${testMode ? "Test payments: nothing leaves a real account." : "Payments through " + rec.provider + "."} Cooperatives add money, managers approve pay runs, farmers are paid by M-Pesa.`),
    el("div", { class: "grid2" },
      panel("shield", "Daily money check", "Compares the payment account with what the records say should be there.",
        L ? el("div", { class: "verdict " + (L.status === "ok" ? "" : "high") }, el("b", {}, L.status === "ok" ? "Balanced." : "Mismatch."), " ", L.detail, el("div", { class: "small muted" }, when(L.created_at)))
          : el("div", { class: "empty" }, "Not run yet."),
        el("div", { class: "mt" }, smallBtn("Run the check now", "", () => act(() => req("/reconciliation/run", {}), "Money check done")))),
      panel("coins", "Money coming in", testMode ? "Test mode: confirm a funding only when the money is really in." : "Confirmed automatically by the payment company.", table([
        { h: "Cooperative", v: f => f.coop_name }, { h: "Amount", num: 1, v: f => kes(f.amount) }, { h: "When", v: f => when(f.created_at) },
        { h: "Status", v: f => f.status === "pending" && f.test ? el("div", { class: "acts" }, smallBtn("Confirm", "go", () => act(() => req(`/fundings/${f.id}/confirm`, {}), "Funding confirmed")), smallBtn("Reject", "warn", () => act(() => req(`/fundings/${f.id}/reject`, {}), "Funding rejected")))
          : chip(cap(f.status), f.status === "completed" ? "" : f.status === "pending" ? "gold" : "grey") }], fundings.slice(0, 12)))),
    panel("farmer", "Pay runs", "A manager prepares each run in the field app. A second manager, or you, approves it.", table([
      { h: "Cooperative", v: r => r.coop_name }, { h: "Prepared by", v: r => r.created_by }, { h: "Farmers", num: 1, v: r => r.farmers }, { h: "Total", num: 1, v: r => kes(r.total) },
      { h: "When", v: r => when(r.created_at) },
      { h: "Status", v: r => chip(r.status === "draft" ? "Needs approval" : r.status === "cancelled" ? "Cancelled" : r.problems ? `${r.problems} need checking` : `${r.paid} of ${r.farmers} paid`, r.status === "draft" ? "gold" : r.status === "cancelled" ? "grey" : r.problems ? "red" : "") }],
      runs, r => go("money", r.id))),
    panel("warn", "Payments needing a person", "The payment company gave no clear answer, or the payment cannot be sent automatically. Check your payment dashboard before acting.",
      problem.length ? table([
        { h: "Farmer", v: p => [el("b", {}, p.name), el("div", { class: "small muted" }, p.coop_name)] }, { h: "Phone", v: p => p.phone }, { h: "Amount", num: 1, v: p => kes(p.amount) },
        { h: "Problem", v: p => [chip(cap(p.status), "red"), el("div", { class: "small muted" }, p.last_error)] },
        { h: "", v: p => el("div", {}, unpaidForm(p),
          inline([field("M-Pesa receipt (if it was paid)", inp("receipt"))], "Mark paid", v => act(() => req(`/payouts/${p.id}/mark-paid`, v), "Marked paid"))) }], problem)
        : el("div", { class: "empty" }, "Nothing needs attention.")));
}

// Sending again or returning needs proof the farmer was not already paid: AgriProof asks the payment
// company when it can, otherwise the operator writes down what they checked.
function unpaidForm(p) {
  const reason = inp("reason", { placeholder: "What you checked, e.g. no payment to this number in the dashboard" });
  const go = (verb, msg) => act(() => req(`/payouts/${p.id}/${verb}`, { reason: reason.value }), msg);
  return el("div", { class: "inline" }, field("Checked that it was not paid", reason),
    smallBtn("Send again", "", () => go("retry", "Queued to send again")),
    smallBtn("Return to next run", "warn", () => go("return", "Returned: it will be in the next pay run")));
}

async function payrunDetail(id) {
  const d = await req(`/payruns/${id}`);
  const p = d.payrun;
  return el("div", {}, el("button", { class: "back", type: "button", onclick: () => go("money") }, icon("back"), "Money"),
    head(`${kes(p.total)} for ${p.farmers} farmers`, `${p.coop_name}. Prepared by ${p.created_by} on ${when(p.created_at)}.${p.approved_by ? " Approved by " + p.approved_by + "." : ""}`,
      p.status === "draft" ? [el("button", { class: "btn go", type: "button", onclick: () => act(() => req(`/payruns/${id}/approve`, {}), "Approved. Payments are being sent.") }, icon("coins"), "Approve and pay"),
        el("button", { class: "btn warn", type: "button", onclick: () => act(() => req(`/payruns/${id}/cancel`, {}), "Pay run cancelled") }, "Cancel")] : chip(cap(p.status))),
    panel("farmer", "Farmers", null, table([
      { h: "No.", v: l => l.member_no }, { h: "Farmer", v: l => el("b", {}, l.name) }, { h: "Phone", v: l => l.phone }, { h: "Deliveries", num: 1, v: l => l.deliveries },
      { h: "Weight", num: 1, v: l => kg(l.kg) }, { h: "Amount", num: 1, v: l => kes(l.amount) },
      { h: "Payment", v: l => l.payout_status ? chip(cap(l.payout_status), l.payout_status === "paid" ? "" : ["unknown", "manual", "failed"].includes(l.payout_status) ? "red" : "gold") : null }], d.lines)));
}

/* ---------------- activity ---------------- */
async function audit() {
  const list = await req("/audit?limit=200");
  return el("div", {}, head("Activity log", "Every sign-in and every change, by whom and from where. It cannot be edited."),
    panel("book", "Latest activity", null, table([
      { h: "When", v: a => when(a.created_at) }, { h: "Who", v: a => [el("b", {}, a.actor), el("div", { class: "small muted" }, a.actor_type)] },
      { h: "What", v: a => a.action.replace(/[._]/g, " ") }, { h: "Detail", v: a => el("span", { class: "mono" }, a.detail ? JSON.stringify(a.detail).slice(0, 140) : a.target) }, { h: "From", v: a => a.ip }], list)));
}

start();
})();
</script>
</body>
</html>
