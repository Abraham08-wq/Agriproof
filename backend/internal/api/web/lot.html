<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F7A2E">
<meta name="description" content="Where this produce came from, checked against sealed cooperative records.">
<title>Produce proof · AgriProof</title>
<link rel="icon" href="/app/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style nonce="{{NONCE}}">
{{THEME}}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 14px) 20px 14px;max-width:1000px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:21px;color:var(--soil);text-decoration:none}
.brand svg{width:30px;height:30px}
.hero{position:relative;background:url("/brand/field.jpg") center 60%/cover no-repeat,linear-gradient(150deg,#6CCB5F,#2E9A3A 60%,#1F7A2E);color:#fff}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,80,34,.05),rgba(20,80,34,.72))}
.hero .in{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:120px 20px 40px}
.hero .code{font-family:var(--mono);font-size:15px;opacity:.9}
.hero h1{color:#fff;font-size:clamp(34px,6.5vw,58px);font-weight:800;max-width:18ch;margin-top:8px}
.hero p{font-size:19px;margin:10px 0 0;color:#F1FBEA}
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px 40px;display:grid;gap:20px}
.seal{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:center;padding:22px;border-radius:var(--r-l);background:var(--shoot)}
.seal.bad{background:var(--tomato-soft)}
.seal .ic{width:64px;height:64px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;animation:pop .5s ease}
.seal.bad .ic{background:var(--tomato)}
.seal .ic svg{width:34px;height:34px}
.seal h2{font-size:24px}
.seal p{margin:4px 0 0}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:18px}
.fig b{display:block;font-family:var(--display);font-size:30px;font-weight:800;color:var(--stalk);letter-spacing:-.02em}
.fig span{color:var(--soil-2);font-size:15px}
.paid{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:20px}
.bar{height:16px;border-radius:99px;background:var(--shoot);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--stalk));border-radius:99px;width:0;transition:width 1.2s cubic-bezier(.3,.7,.3,1)}
table{width:100%;border-collapse:collapse;font-size:16px}
th{text-align:left;font-weight:700;color:var(--soil-2);font-size:14px;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;overflow-x:auto}
.box h2{font-size:22px;margin-bottom:6px}
.empty{padding:80px 20px;text-align:center}
footer{max-width:1000px;margin:0 auto;padding:0 20px calc(var(--safe-bottom) + 30px);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/check"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 29V12" stroke="#1F7A2E" stroke-width="3" stroke-linecap="round"/><path d="M16 18C10 18 5 14 4 7c7 0 12 4 12 11z" fill="#4CB944"/><path d="M16 14c0-6 4-10 11-10-1 7-5 11-11 10z" fill="#1F7A2E"/></svg>AgriProof</a>
</header>
<div id="root"><div class="empty"><div class="spinner"></div></div></div>
<footer>
  <span class="credit">Photo: Roger Starnes Sr on <a href="https://unsplash.com/photos/_-Iril-hKUs" rel="noopener">Unsplash</a></span>
  <span class="credit">Records sealed by AgriProof</span>
</footer>
<script nonce="{{NONCE}}">
"use strict";
(() => {
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === "class") n.className = v; else n.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
}
function svg(d) {
  const s = document.createElementNS(NS, "svg");
  for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.4", "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) s.setAttribute(k, v);
  for (const p of d.split("|")) { const e = document.createElementNS(NS, "path"); e.setAttribute("d", p); s.append(e); }
  return s;
}
const nf = new Intl.NumberFormat("en-KE");
const day = t => t ? new Date(t).toLocaleDateString("en-KE", { day: "numeric", month: "short", year: "numeric" }) : "";
const root = document.getElementById("root");
const code = (location.pathname.split("/")[2] || "").toUpperCase();

fetch("/public/lots/" + encodeURIComponent(code)).then(async r => {
  const p = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(r.status === 404 ? "This proof code is not known. Check the code on the label." : (p.error || "Could not load this proof."));
  return p;
}).then(p => {
  const sealed = p.records_valid && p.sealed_on_chain;
  const bar = el("i");
  const span = p.first_delivery && p.last_delivery ? (day(p.first_delivery) === day(p.last_delivery) ? day(p.first_delivery) : `${day(p.first_delivery)} to ${day(p.last_delivery)}`) : "";
  root.replaceChildren(
    el("section", { class: "hero" }, el("div", { class: "in" },
      el("div", { class: "code" }, `Lot ${p.code}`),
      el("h1", {}, `${nf.format(Math.round(p.kg))} kg of ${p.crop_name.toLowerCase()} from ${p.farms} ${p.farms === 1 ? "farm" : "farms"}`),
      el("p", {}, `${p.cooperative}${p.county ? ", " + p.county : ""}${span ? ". Delivered " + span : ""}.`))),
    el("main", { class: "wrap" },
      el("div", { class: "seal" + (p.records_valid ? "" : " bad") },
        el("div", { class: "ic" }, svg(p.records_valid ? "M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6l7-3z|M8.5 12.5l2.5 2.5 4.5-5" : "M6 6l12 12|M18 6L6 18")),
        el("div", {},
          el("h2", {}, p.records_valid ? (sealed ? "Records match the blockchain seal" : "Records intact") : "Records do not match their seal"),
          el("p", {}, p.records_valid
            ? (sealed ? "Every weight and payment behind this lot was sealed when it was recorded, and nothing has been changed since." : "The record chain is intact; the newest entries are waiting to be sealed on the blockchain.")
            : "Something in the cooperative's records was changed after it was sealed. Ask the cooperative before buying."))),
      el("div", { class: "figs" },
        el("div", { class: "fig" }, el("b", {}, nf.format(p.deliveries)), el("span", {}, "weighed deliveries")),
        el("div", { class: "fig" }, el("b", {}, nf.format(Math.round(p.grade1_kg))), el("span", {}, "kg graded 1")),
        el("div", { class: "fig" }, el("b", {}, p.farms), el("span", {}, p.farms === 1 ? "farm, each with its own SMS receipt" : "farms, each with their own SMS receipts")),
        p.buyer ? el("div", { class: "fig" }, el("b", {}, p.buyer), el("span", {}, "buyer")) : null),
      el("div", { class: "paid" },
        el("h2", {}, `${Math.round(p.farmers_paid_pct)}% of farmers' money paid`),
        el("div", { class: "bar", role: "img", "aria-label": `${Math.round(p.farmers_paid_pct)} percent paid` }, bar),
        el("span", { class: "muted small" }, "Paid by M-Pesa from the cooperative's account; each payment is in the sealed records.")),
      el("div", { class: "box" },
        el("h2", {}, "Fertilizer and seed used by these farms"),
        p.inputs.length ? el("table", {},
          el("thead", {}, el("tr", {}, el("th", {}, "Product"), el("th", {}, "Supplier"), el("th", {}, "Batch"), el("th", {}, "Lab test"), el("th", {}, "Farms"))),
          el("tbody", {}, p.inputs.map(x => el("tr", {},
            el("td", {}, x.product, x.status === "recalled" ? [" ", el("span", { class: "chip red" }, "recalled")] : null),
            el("td", {}, x.supplier), el("td", {}, x.batch_no),
            el("td", {}, el("span", { class: "chip " + ({ pass: "", fail: "red", untested: "grey" }[x.lab_result] || "grey") }, { pass: "Passed", fail: "Failed", untested: "Not tested" }[x.lab_result] || x.lab_result)),
            el("td", {}, x.farms)))))
          : el("p", { class: "muted" }, "No registered fertilizer or seed was recorded for these farms."))));
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = Math.max(0, Math.min(100, p.farmers_paid_pct)) + "%"; }));
  document.title = `Lot ${p.code} · AgriProof`;
}).catch(e => root.replaceChildren(el("div", { class: "empty" }, el("h1", {}, "Not found"), el("p", { class: "muted" }, e.message))));
})();
</script>
</body>
</html>
